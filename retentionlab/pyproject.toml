[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retentionlab"
version = "1.0.0"
description = "A reproducible, end-to-end customer-churn data science study"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["data-science", "churn", "pandas", "matplotlib", "seaborn", "machine-learning", "pipeline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.optional-dependencies]
full = ["scipy>=1.11", "scikit-learn>=1.4"]

[project.scripts]
retentionlab = "retentionlab.cli:main"

[project.urls]
Homepage = "https://github.com/yourname/retentionlab"

[tool.setuptools.packages.find]
include = ["retentionlab*"]
